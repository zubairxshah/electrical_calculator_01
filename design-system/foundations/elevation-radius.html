<!-- @dsCard group="Foundations" name="Elevation & Radius" subtitle="radius 0.5rem · card shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elevation & Radius — ElectroMate</title>
<style>
  :root { --card: 0 0% 100%; --foreground: 222.2 84% 4.9%; --muted-foreground: 215.4 16.3% 46.9%; --border: 214.3 31.8% 91.4%; --radius: 0.5rem; --background: 210 40% 98%; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: hsl(var(--background)); font-family: ui-sans-serif, system-ui, sans-serif; color: hsl(var(--foreground)); }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .grid { display: flex; gap: 24px; flex-wrap: wrap; }
  .box { width: 200px; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 20px; }
  .sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
  .md { box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1); }
  .name { font-weight: 600; font-size: 14px; }
  .val { font-size: 12px; color: hsl(var(--muted-foreground)); font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
  .radii { display: flex; gap: 16px; margin-top: 32px; align-items: flex-end; }
  .r { width: 72px; height: 72px; background: hsl(222.2 47.4% 11.2%); }
</style>
</head>
<body>
  <h1>Elevation &amp; Radius</h1>
  <div class="grid">
    <div class="box sm"><div class="name">Card · rest</div><div class="val">shadow-sm</div></div>
    <div class="box md"><div class="name">Card · hover</div><div class="val">shadow-md (200ms)</div></div>
  </div>
  <div class="radii">
    <div><div class="r" style="border-radius:0.25rem"></div><div class="val">sm 0.25rem</div></div>
    <div><div class="r" style="border-radius:0.5rem"></div><div class="val">base 0.5rem</div></div>
    <div><div class="r" style="border-radius:0.75rem"></div><div class="val">lg 0.75rem</div></div>
  </div>
</body>
</html>
