<!-- @dsCard group="Patterns" name="Battery — Input Form" subtitle="Current layout · 2-col grid + reset" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battery Input Form — ElectroMate</title>
<style>
  :root { --card: 0 0% 100%; --foreground: 222.2 84% 4.9%; --muted-foreground: 215.4 16.3% 46.9%; --border: 214.3 31.8% 91.4%; --destructive: 0 84.2% 60.2%; --primary: 222.2 47.4% 11.2%; --radius: 0.5rem; --background: 210 40% 98%; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: hsl(var(--background)); font-family: ui-sans-serif, system-ui, sans-serif; color: hsl(var(--foreground)); }
  .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); max-width: 640px; }
  .header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .title { font-size: 16px; font-weight: 600; }
  .desc { font-size: 14px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
  .badges { display: flex; gap: 4px; }
  .badge { font-size: 11px; padding: 2px 8px; border: 1px solid hsl(var(--border)); border-radius: 9999px; white-space: nowrap; }
  .content { padding: 16px 24px 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 24px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 14px; font-weight: 500; }
  .req { color: hsl(var(--destructive)); margin-left: 2px; }
  .wrap { position: relative; }
  input, select { width: 100%; height: 48px; padding: 0 12px; font-size: 14px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); background: #fff; color: inherit; }
  input { padding-right: 40px; }
  .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: hsl(var(--muted-foreground)); }
  .helper { font-size: 12px; color: hsl(var(--muted-foreground)); }
  .actions { margin-top: 20px; }
  .btn { height: 44px; padding: 0 18px; font-size: 14px; font-weight: 500; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid hsl(var(--border)); cursor: pointer; }
  svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div><div class="title">Input Parameters</div><div class="desc">Enter your battery system specifications</div></div>
      <div class="badges"><span class="badge">IEEE 485-2020</span><span class="badge">IEC 60038</span></div>
    </div>
    <div class="content">
      <div class="grid">
        <div class="field"><label>System Voltage<span class="req">*</span></label><div class="wrap"><input value="48"><span class="unit">V</span></div></div>
        <div class="field"><label>Battery Capacity<span class="req">*</span></label><div class="wrap"><input value="200"><span class="unit">Ah</span></div></div>
        <div class="field"><label>Load Power<span class="req">*</span></label><div class="wrap"><input value="2000"><span class="unit">W</span></div></div>
        <div class="field"><label>System Efficiency<span class="req">*</span></label><div class="wrap"><input value="0.9"></div></div>
        <div class="field"><label>Battery Aging Factor<span class="req">*</span></label><div class="wrap"><input value="0.8"></div></div>
        <div class="field"><label>Battery Chemistry<span class="req">*</span></label><select><option>VRLA AGM (Sealed Lead-Acid)</option></select><div class="helper">Select chemistry for accurate discharge characteristics</div></div>
      </div>
      <div class="actions">
        <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset to Defaults</button>
      </div>
    </div>
  </div>
</body>
</html>
