<!-- @dsCard group="Components" name="CalculationCard" subtitle="Title + description + standards badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CalculationCard — ElectroMate</title>
<style>
  :root { --card: 0 0% 100%; --foreground: 222.2 84% 4.9%; --muted-foreground: 215.4 16.3% 46.9%; --border: 214.3 31.8% 91.4%; --radius: 0.5rem; --background: 210 40% 98%; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: hsl(var(--background)); font-family: ui-sans-serif, system-ui, sans-serif; color: hsl(var(--foreground)); }
  .card { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); max-width: 560px; }
  .header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .title { font-size: 16px; font-weight: 600; }
  .desc { font-size: 14px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge { font-size: 11px; padding: 2px 8px; border: 1px solid hsl(var(--border)); border-radius: 9999px; color: hsl(var(--foreground)); white-space: nowrap; }
  .content { padding: 16px 24px 24px; }
  .placeholder { border: 1px dashed hsl(var(--border)); border-radius: var(--radius); padding: 24px; text-align: center; font-size: 13px; color: hsl(var(--muted-foreground)); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <div class="title">Input Parameters</div>
        <div class="desc">Enter your battery system specifications</div>
      </div>
      <div class="badges">
        <span class="badge">IEEE 485-2020</span>
        <span class="badge">IEC 60038</span>
      </div>
    </div>
    <div class="content">
      <div class="placeholder">{ children — form fields, results, or info }</div>
    </div>
  </div>
</body>
</html>
